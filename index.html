<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="card">
        <div class="search">
            <div class="input-wrapper">
                <input type="text" id="city-input" placeholder="Введіть місто..." autocomplete="off" spellcheck="false">
                <div id="suggestions" class="suggestions"></div>
            </div>
        </div>

        <div class="weather">
            <h1 class="city">--</h1>
            <h2 class="temp">--°C</h2>
            
            <div class="details">
                <span class="wind-label">💨 Вітер:</span>
                <span class="wind">-- км/год</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>І
