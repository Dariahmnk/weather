<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="search">
            <input type="text" id="city-input" placeholder="Введіть місто..." spellcheck="false">
            <button id="search-btn" aria-label="Пошук">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#333" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
    </svg>
</button>
        </div>

        <div class="weather">
            <h1 class="city">--</h1>
            <h2 class="temp">--°C</h2>
            
            <div class="details">
                <span class="wind-label">💨 Вітер:</span>
                <span class="wind">-- km/h</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
