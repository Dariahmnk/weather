<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <div class="search">
            <input type="text" id="city-input" placeholder="Введіть місто..." spellcheck="false">
            <button id="search-btn">🔍</button>
        </div>

        <div class="weather">
            <h1 class="city">--</h1>
            <h2 class="temp">--°C</h2>
            
            <div class="details">
                <span class="wind-label">💨 Вітер:</span>
                <span class="wind">-- km/h</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
